# ============================================================
# EduAI 生产环境 Nginx 配置
# 前端静态托管 + 反代后端 /api /uploads /ocr + SSE 流式
# 用法：把 root 改成实际 dist 路径，server_name 改成域名
# ============================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;   # 允许上传大文件（讲义/资源）

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;   # TODO: 换成你的域名

        # 前端静态文件（vite build 产物）
        root /path/to/eduai/web/dist;
        index index.html;

        # SPA history 模式 fallback —— 关键，否则刷新子路由 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的静态资源长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API 反代到后端 Spring Boot :8080
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection '';
            proxy_buffering off;        # SSE 流式输出不缓冲
            proxy_cache off;
            proxy_read_timeout 600s;    # AI 长响应（10 分钟）
        }

        # 上传文件 /uploads/*
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # OCR 代理（PaddleOCR :8765，轮询最长 5 分钟）
        location /ocr {
            proxy_pass http://127.0.0.1:8765;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
    }
}
